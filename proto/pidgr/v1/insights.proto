syntax = "proto3";

package pidgr.v1;

import "google/protobuf/timestamp.proto";
import "pidgr/v1/common.proto";

option go_package = "github.com/pidgr/pidgr-proto/gen/go/pidgr/v1;pidgrv1";

// ─── Enums ──────────────────────────────────────────────────────────────────

// Confidence level for cohort-level predictions, based on available data volume.
enum ConfidenceLevel {
  CONFIDENCE_LEVEL_UNSPECIFIED = 0;
  // Fewer than 50 campaigns — predictions based on heuristics/industry benchmarks.
  CONFIDENCE_LEVEL_LOW = 1;
  // 50-200 campaigns — basic clustering available, wide confidence intervals.
  CONFIDENCE_LEVEL_MEDIUM = 2;
  // 200+ campaigns — full ML pipeline, narrow confidence intervals.
  CONFIDENCE_LEVEL_HIGH = 3;
}

// Pipeline state for a group's archetypes. Lets the admin UI render
// distinct empty-state affordances ("run clustering" vs "need N more
// sessions" vs "pipeline ran but audience was too homogeneous") instead
// of treating every empty archetype list the same. Populated by
// InsightsService.GetGroupArchetypes.
enum PipelineState {
  PIPELINE_STATE_UNSPECIFIED = 0;
  // The ML pipeline has never fired for this org. Archetypes are
  // empty because nothing ran, not because of data shape.
  PIPELINE_STATE_NEVER_RUN = 1;
  // The pipeline ran but the group had fewer than the k-anonymization
  // minimum feature vectors (50), so clustering was skipped. UI
  // renders "keep running campaigns" affordance.
  PIPELINE_STATE_BELOW_THRESHOLD = 2;
  // The pipeline ran with enough vectors but the clustering provider
  // returned zero clusters — typically means the audience is too
  // homogeneous to separate into distinct archetypes.
  PIPELINE_STATE_NO_CLUSTERS = 3;
  // Archetypes are populated and ready to render.
  PIPELINE_STATE_READY = 4;
}

// Where an archetype came from. Lets clients distinguish trained ML
// clustering output from low-confidence provisional output generated
// for sandboxes and opted-in organizations before enough engagement
// data exists. Clients MUST render a low-confidence disclaimer for
// PROVISIONAL archetypes.
enum ArchetypeSource {
  ARCHETYPE_SOURCE_UNSPECIFIED = 0;
  // Produced by the trained ML clustering pipeline (k-anonymized,
  // DP-noised behavioral feature vectors).
  ARCHETYPE_SOURCE_ML = 1;
  // Rule-based provisional output derived from coarse delivery/read/
  // ack activity (or a stable starter distribution for sandboxes with
  // no activity). Low confidence, never written to the ML artifact
  // path, and always superseded by ML output once available.
  ARCHETYPE_SOURCE_PROVISIONAL = 2;
}

// ─── Messages ───────────────────────────────────────────────────────────────

// A behavioral archetype describing a cohort pattern (never an individual).
// Derived from k-anonymized, DP-noised behavioral feature vectors.
message Archetype {
  // Human-readable label (e.g., "Swift Acknowledger", "Thorough Reader").
  string label = 1;
  // Description of the behavioral pattern this archetype represents.
  string description = 2;
  // Proportion of the group that belongs to this archetype (0.0-1.0).
  float percentage = 3;
  // Centroid of the behavioral feature vector for this archetype.
  // Keys are stable dimension names from the feature extractor
  // vocabulary (e.g., "tap_density", "engagement_depth",
  // "scroll_velocity_p50", "idle_gap_p75"). Single-letter keys are
  // reserved for backward compatibility with pre-v0.64 servers and
  // SHALL be ignored by clients.
  map<string, double> feature_centroid = 4;
  // Per-dimension distribution of the archetype's members. Lets the
  // admin render percentile bands instead of single-point centroids.
  // Absent until at least k members exist in the cluster. Keys mirror
  // `feature_centroid` keys.
  map<string, DimensionStats> feature_breakdown = 5;
  // Tap density heatmap aggregated across sessions for this
  // archetype. Cohort-level only — never per-session timing.
  // Absent when fewer than k sessions have tap data.
  optional TapHeatmap tap_heatmap = 6;
  // Forecast of cluster share at fixed horizons (7/14/30/90 days).
  // Absent during cold start before historical clustering runs exist
  // to extrapolate from.
  optional ArchetypeForecast forecast = 7;
  // Sessions that sit at the median and quartiles of the archetype's
  // centroid distance, ranked by distance. Bounded at three entries.
  // Absent until at least 50 sessions have been scored.
  // Sessions can come from any client that emits to ReplayService —
  // mobile (iOS, Android) or desktop (macOS, Windows, Linux).
  repeated ExemplarSession exemplar_sessions = 8;
  // Per-screen dwell time distribution, derived from session replay.
  // Absent when fewer than k sessions per screen exist.
  optional ScreenDwell screen_dwell = 9;
  // End-to-end response latencies (push delivered → read → ack) for
  // members of this archetype, as percentiles. Absent until at least
  // k campaign deliveries have been recorded for this archetype.
  optional ResponseTimeline response_timeline = 10;
  // Where this archetype came from. UNSPECIFIED on responses from
  // pre-v0.81 servers; clients SHOULD treat UNSPECIFIED as ML for
  // backward compatibility (provisional output is always labelled).
  ArchetypeSource source = 11;
}

// Per-dimension distribution stats for one feature dimension within
// an archetype's cohort. All values are in the same units as
// `Archetype.feature_centroid`. Used to render percentile bands on
// the admin's behavioral profile panel.
message DimensionStats {
  // Centroid value (same as Archetype.feature_centroid[key]).
  double centroid = 1;
  // 25th percentile across the archetype's members.
  double p25 = 2;
  // Median across the archetype's members.
  double p50 = 3;
  // 75th percentile across the archetype's members.
  double p75 = 4;
  // Median across the entire group (all archetypes), included so the
  // admin can render "this archetype is X% above group median".
  double group_p50 = 5;
}

// A density grid of tap activity for one archetype, normalized to
// [0.0, 1.0] where 1.0 is the hottest cell in the cohort. Cohort-
// level only.
message TapHeatmap {
  // Width of the density grid in cells.
  int32 width = 1;
  // Height of the density grid in cells.
  int32 height = 2;
  // Row-major density values, length must equal width*height. All in
  // [0.0, 1.0].
  repeated double values = 3;
  // Number of sessions aggregated. Always >= MinFeatureVectorsForClustering
  // when the field is present.
  int32 session_count = 4;
  // Optional per-event-type breakdown. When present, the writer
  // SHALL emit one entry for each event type in the source data
  // (TAP, LONG_PRESS, SCROLL, ACTION_CLICK).
  repeated TapHeatmapLayer layers = 5;
}

// One per-event-type layer of a TapHeatmap.
message TapHeatmapLayer {
  // Event type this layer represents (e.g., "TAP", "LONG_PRESS",
  // "SCROLL", "ACTION_CLICK").
  string event_type = 1;
  // Row-major density values, same dimensions as the parent
  // TapHeatmap. Independently normalized to [0.0, 1.0].
  repeated double values = 2;
}

// Predicted cluster share at fixed horizons with confidence bands.
message ArchetypeForecast {
  // Horizons in increasing days. Always one entry each for 7, 14,
  // 30, and 90 days when the field is present.
  repeated ForecastHorizon horizons = 1;
}

// Predicted share at one horizon with a 90% prediction interval.
message ForecastHorizon {
  // Horizon length in days (one of: 7, 14, 30, 90).
  int32 days = 1;
  // Predicted fraction of the group falling in this archetype at the
  // horizon (0.0-1.0).
  double predicted_share = 2;
  // 5th-percentile lower bound of the prediction interval.
  double lower = 3;
  // 95th-percentile upper bound of the prediction interval.
  double upper = 4;
  // Confidence in this horizon's prediction.
  ConfidenceLevel confidence = 5;
}

// Pointer to a representative session for one archetype, ranked by
// distance to the archetype centroid.
message ExemplarSession {
  // Session recording ID retrievable via ReplayService for the same
  // org. Linkable from the admin regardless of originating platform.
  string session_id = 1;
  // Quantile rank within the archetype: 25, 50, or 75. The writer
  // emits at most one session per rank.
  int32 rank = 2;
  // L2 distance from the session's feature vector to the centroid.
  double distance = 3;
  // Optional duration metadata for quick admin labelling.
  int32 duration_seconds = 4;
  // Optional platform identifier from the vocabulary
  // {"ios", "android", "macos", "windows", "linux"}. The admin
  // renders unknown values verbatim for forward compatibility.
  string platform = 5;
}

// Per-screen dwell distribution within an archetype. Lets the admin
// surface "this archetype lingers 8.2s on the Message Detail screen
// vs 0.4s on the Inbox list".
message ScreenDwell {
  // One entry per screen. Screens with fewer than k members in the
  // archetype are dropped from the list (not marked as absent).
  repeated ScreenDwellEntry entries = 1;
}

message ScreenDwellEntry {
  // Stable screen identifier (e.g., "MessageDetail", "Inbox",
  // "ProfileSettings"). Sourced from the same screen_name vocabulary
  // used by heatmap_cells.
  string screen_name = 1;
  // Median dwell time in seconds for this archetype on this screen.
  double median_seconds = 2;
  // 75th-percentile dwell time in seconds.
  double p75_seconds = 3;
  // Number of distinct sessions aggregated for this screen.
  int32 session_count = 4;
}

// End-to-end response latencies for members of one archetype, in
// seconds. Each percentile is computed across all qualifying campaign
// deliveries for the archetype's members within the rolling window.
message ResponseTimeline {
  // Time from `delivered_at` to `read_at`, in seconds.
  LatencyPercentiles read_after_delivered = 1;
  // Time from `read_at` to `acknowledged_at`, in seconds. Only
  // includes deliveries that were both read and acknowledged.
  LatencyPercentiles ack_after_read = 2;
  // End-to-end time from `delivered_at` to `acknowledged_at`, in
  // seconds. Only includes deliveries that were acknowledged.
  LatencyPercentiles ack_after_delivered = 3;
  // Number of deliveries the timeline is computed over.
  int32 delivery_count = 4;
}

// Latency distribution stats. Values are in seconds.
message LatencyPercentiles {
  double p50 = 1;
  double p75 = 2;
  double p95 = 3;
}

// A cohort-level prediction for campaign acknowledgment rate.
// Never targets or scores individuals — always represents an audience aggregate.
message CohortPrediction {
  // Predicted ACK rate for the audience (0.0-1.0).
  float predicted_ack_rate = 1;
  // Lower bound of the confidence interval.
  float confidence_low = 2;
  // Upper bound of the confidence interval.
  float confidence_high = 3;
  // Confidence level based on available data volume.
  ConfidenceLevel confidence_level = 4;
  // Number of anonymous data points used for this prediction.
  int32 data_point_count = 5;
}

// Advisory information for campaign configuration, combining predictions and archetypes.
message CampaignAdvisory {
  // Cohort-level ACK prediction for the target audience.
  CohortPrediction predicted_ack = 1;
  // Suggested escalation delay in minutes based on historical cohort patterns.
  // 0 if insufficient data.
  int32 suggested_escalation_delay_minutes = 2;
  // Behavioral archetypes for the target audience.
  repeated Archetype archetypes = 3;
  // Which archetype set the advisory's breakdown was computed from.
  // UNSPECIFIED on responses from older servers; clients SHOULD treat
  // UNSPECIFIED as ML for backward compatibility. Clients MUST render
  // a low-confidence disclaimer when PROVISIONAL.
  ArchetypeSource archetype_source = 4;
}

// Request to retrieve behavioral archetypes for a group.
message GetGroupArchetypesRequest {
  // ID of the group to query archetypes for. Required.
  string group_id = 1;
}

// Response containing behavioral archetypes for a group.
message GetGroupArchetypesResponse {
  // Behavioral archetypes for the group (empty if insufficient data).
  repeated Archetype archetypes = 1;
  // Number of anonymous feature vectors used for clustering.
  int32 data_point_count = 2;
  // Why `archetypes` looks the way it does. Lets the UI render a
  // distinct empty-state affordance for "never trained" vs
  // "below threshold" vs "no clusters" vs "ready". See PipelineState.
  PipelineState pipeline_state = 3;
  // Confidence in the returned archetypes, derived from available data
  // volume. Always CONFIDENCE_LEVEL_LOW when provisional archetypes
  // are returned — clients use this plus `Archetype.source` to render
  // the low-confidence disclaimer.
  ConfidenceLevel confidence_level = 4;
}

// Request to predict cohort-level ACK rate for a campaign configuration.
message PredictCampaignACKRequest {
  // ID of the target audience group. Required.
  string group_id = 1;
  // Template type (optional, for prediction refinement).
  string template_type = 2;
  // Number of workflow steps (optional, for prediction refinement).
  int32 workflow_step_count = 3;
}

// Response containing a cohort-level ACK prediction.
message PredictCampaignACKResponse {
  // Cohort-level prediction.
  CohortPrediction prediction = 1;
}

// Request for campaign configuration advisory.
message GetCampaignAdvisoryRequest {
  // ID of the target audience group. Required.
  string group_id = 1;
  // Template ID (optional, for advisory context).
  string template_id = 2;
  // Template version (optional).
  int32 template_version = 3;
  // Number of workflow steps (optional).
  int32 workflow_step_count = 4;
}

// Response containing campaign advisory information.
message GetCampaignAdvisoryResponse {
  // Campaign advisory with prediction, suggested escalation, and archetypes.
  CampaignAdvisory advisory = 1;
}

// Request to generate an AI narrative for a group's insights.
message GetInsightNarrativeRequest {
  // ID of the group to generate a narrative for. Required.
  string group_id = 1;
  // Name of the prompt template to use (e.g., "campaign-advisory", "archetype-explanation").
  string prompt_name = 2;
}

// Response containing an AI-generated narrative.
message GetInsightNarrativeResponse {
  // AI-generated narrative text (Markdown formatted).
  string narrative = 1;
  // Timestamp when the narrative was generated.
  google.protobuf.Timestamp generated_at = 2;
  // Model identifier used for generation.
  string model_id = 3;
}

// Request to manually trigger the ML training pipeline.
// Empty — organization is extracted from the JWT.
message TriggerMLPipelineRequest {}

// Response after triggering the ML pipeline.
message TriggerMLPipelineResponse {
  // Remaining manual retrains allowed this month.
  int32 remaining_this_month = 1;
  // Timestamp of the last successful training (null if never trained).
  google.protobuf.Timestamp last_trained_at = 2;
}

// Request to manually retrigger archetype clustering for a single group
// without rerunning the full SageMaker training pipeline. Reuses the
// already-deployed clustering model.
message TriggerArchetypeClusteringRequest {
  // Group to recluster. Org is extracted from the JWT.
  string group_id = 1;
}

// Response after triggering archetype clustering for one group.
message TriggerArchetypeClusteringResponse {
  // Temporal workflow id — useful for client-side dedupe + operator
  // debugging via the Temporal UI.
  string workflow_id = 1;
  // Remaining manual retrains allowed this month. Shares the same
  // monthly counter as TriggerMLPipeline (ml_manual_limit_monthly).
  int32 remaining_this_month = 2;
  // Timestamp of the last successful archetype clustering for this
  // (org, group), null if never clustered.
  google.protobuf.Timestamp last_clustered_at = 3;
}

// Request to draft a campaign body for a given archetype using Bedrock.
// Used by the Compass "Target this archetype in a new campaign" CTA to
// pre-fill the campaign creation wizard's body field.
message GenerateCampaignBodyDraftRequest {
  // UUID of the source group whose archetype set the label belongs to.
  string group_id = 1;
  // Stable archetype label, e.g. "Swift Acknowledger".
  string archetype_label = 2;
  // Lane-recommended action copy passed through from the admin (e.g.
  // "Simplify the call-to-action"). Used as a tone hint for the prompt.
  string lane_action = 3;
}

// Response containing the generated draft body in Markdown.
message GenerateCampaignBodyDraftResponse {
  // Draft Markdown body, 3-5 sentences. Authored as if written for the
  // recipient — does not mention the archetype name.
  string body_markdown = 1;
}

// Which control mechanism a message exercises. Names are technical; clients
// render plain-language labels from their own catalog.
enum Lever {
  LEVER_UNSPECIFIED = 0;
  LEVER_BOUNDARIES = 1;
  LEVER_DIAGNOSTIC = 2;
  LEVER_BELIEFS = 3;
  LEVER_INTERACTIVE = 4;
}

// How a lever classification was produced.
enum LeverSource {
  LEVER_SOURCE_UNSPECIFIED = 0;
  // Produced by a trained classification model.
  LEVER_SOURCE_MODEL = 1;
  // Produced by deterministic rules over campaign metadata.
  LEVER_SOURCE_RULES = 2;
}

// Share of an organization's campaigns exercising one lever.
message LeverShare {
  Lever lever = 1;
  int32 count = 2;
  // Fraction of classified campaigns, 0..1.
  float share = 3;
  // Where the majority of this lever's classifications came from.
  // Consumers use this together with `avg_confidence` to present
  // rule-derived mixes as estimates rather than model-grade
  // classifications.
  LeverSource dominant_source = 4;
  // Mean classifier confidence across the campaigns counted here, 0..1.
  float avg_confidence = 5;
}

// How much messaging lands on a single person over the observed window.
message RecipientLoad {
  float median_per_week = 1;
  float p90_per_week = 2;
  int32 users_reached = 3;
  int32 window_days = 4;
  // Median number of distinct senders reaching one recipient within
  // the same window.
  float median_distinct_senders = 5;
  // 90th-percentile number of distinct senders reaching one recipient
  // within the same window.
  float p90_distinct_senders = 6;
  // Median number of distinct channels one recipient is reached on
  // within the same window.
  float median_distinct_channels = 7;
  // 90th-percentile number of distinct channels one recipient is
  // reached on within the same window.
  float p90_distinct_channels = 8;
}

message GetOrgCommunicationProfileRequest {}

message GetOrgCommunicationProfileResponse {
  repeated LeverShare lever_mix = 1;
  RecipientLoad load = 2;
  int32 campaigns_analyzed = 3;
  // Fraction of active objectives that have at least one indicator
  // whose evidence comes from outside the product, 0..1.
  //
  // It says how much the rest of the board is worth: an objective
  // observed only through what people answered inside the app has
  // evidence that they said they did it, not evidence that the work
  // changed.
  //
  // Absent when `active_objectives` is zero, because a fraction with no
  // denominator has no value and a present 0.0 would be
  // indistinguishable from genuine coverage of none — opposite facts
  // with opposite consequences. The two counts below travel with it as
  // the second half of the same guarantee.
  optional float evidence_coverage = 4;
  // Numerator of `evidence_coverage`: active objectives with at least
  // one indicator sourced outside the product.
  int32 objectives_with_external_evidence = 5;
  // Denominator of `evidence_coverage`: active objectives. Zero means
  // the organization has declared none, which is a supported way to use
  // the product and not an incomplete setup.
  int32 active_objectives = 6;
  // Median number of days since the organization's indicators were last
  // revised, measured from each indicator's last update.
  //
  // Indicators are rarely revisited when the strategy they serve moves
  // on, and this is the plainest measurable form of that: an ageing
  // median means the board is describing an older intent than the
  // objectives do.
  //
  // Absent when the organization has no indicators. An age of zero
  // would claim they were all just reviewed.
  optional int64 median_indicator_review_age_days = 7;
}

// Which pattern a finding came from. The scope a pattern is entitled to
// speak at is fixed per kind and not a separate field: mutual exclusivity
// and lever mix are properties of the whole declared set, board size and
// drift are properties of one objective, and encouraged behaviour is a
// property of one indicator. Evaluating any of them at another scope is a
// category error rather than a partial view.
enum DiagnosisFindingKind {
  DIAGNOSIS_FINDING_KIND_UNSPECIFIED = 0;
  // An indicator whose evidence source structurally fails one of the
  // qualities a measure needs, and the behaviour that tends to follow.
  DIAGNOSIS_FINDING_KIND_PERVERSE_CONDUCT_RISK = 1;
  // The organization's messages concentrate in some control mechanisms
  // and leave others unused, with the consequences the missing ones
  // would have covered.
  DIAGNOSIS_FINDING_KIND_LEVER_IMBALANCE = 2;
  // The declared objectives overlap each other or leave gaps, so the
  // set does not partition what the organization is trying to hold
  // true.
  DIAGNOSIS_FINDING_KIND_NON_EXCLUSIVE_SET = 3;
  // An objective carries more indicators than anyone reads, or several
  // that measure the same thing by different routes.
  DIAGNOSIS_FINDING_KIND_INFLATED_BOARD = 4;
  // An objective's wording changed and none of its indicators was
  // revisited afterwards.
  DIAGNOSIS_FINDING_KIND_OBJECTIVE_INDICATOR_DRIFT = 5;
}

// One observation in a diagnosis.
//
// Every finding carries the records it was derived from. That is not
// decoration: a statement about an organization that cannot be traced
// back to the campaigns, objectives and indicators that produced it is
// indistinguishable from an opinion, and the reader has no way to
// disagree with it on the facts. At least one of the three reference
// lists is always non-empty.
message DiagnosisFinding {
  // Unique identifier for the finding, stable within the diagnosis.
  // Lets a surface show a finding once at the level where it can be
  // acted on instead of repeating it as a loose warning elsewhere.
  string id = 1;
  // Which pattern produced it.
  DiagnosisFindingKind kind = 2;
  // What was observed, in the organization's own terms. Plain language
  // and free of the vocabulary of the framework the pattern comes from.
  string detail = 3;
  // Campaigns the finding was derived from.
  repeated string campaign_ids = 4;
  // Objectives the finding was derived from.
  repeated string objective_ids = 5;
  // Indicators the finding was derived from.
  repeated string indicator_ids = 6;
  // True when a model wrote `detail`. A model only ever phrases a
  // finding that was already established from the records above; it
  // never decides that there is one. Consumers use this the way they
  // use lever provenance — to present a phrasing as a phrasing.
  bool model_assisted = 7;
}

// The organization-level metrics as they stood when a diagnosis was
// produced, stored with it.
//
// Kept rather than recomputed because two of the four cannot be
// recovered afterwards. Evidence coverage and the indicator review age
// are read off the objectives and indicators as they are configured at
// that moment, and configuration has no history: an objective archived
// or an indicator revised next month silently rewrites what last
// month's answer would have been. A diagnosis stored without its
// snapshot therefore loses the comparison permanently, and the
// comparison is most of why the diagnosis is stored at all.
//
// Fields carry presence on the same terms as the profile response they
// mirror: absent means there was nothing to measure, never zero.
message OrgMetricsSnapshot {
  // Distribution of the classified history across control mechanisms.
  repeated LeverShare lever_mix = 1;
  // How much messaging landed on one person over the observed window.
  RecipientLoad load = 2;
  // Fraction of active objectives with at least one indicator sourced
  // outside the product, 0..1. Absent when there were no active
  // objectives.
  optional float evidence_coverage = 3;
  // Numerator of `evidence_coverage` at generation time.
  int32 objectives_with_external_evidence = 4;
  // Denominator of `evidence_coverage` at generation time.
  int32 active_objectives = 5;
  // Median days since the organization's indicators were last revised.
  // Absent when there were no indicators.
  optional int64 median_indicator_review_age_days = 6;
}

// A dated, stored reading of the organization's own measurement system:
// what it has declared it wants, how it observes it, and what it has
// actually been communicating.
//
// Stored rather than computed on request because the useful statements
// are comparisons — that the mix of messages moved over a quarter, that
// three objectives still have no outcome evidence months later — and a
// stateless query cannot make them. It is also the only shape in which a
// recurring review has something to review.
message OrgDiagnosis {
  // Unique identifier for this run.
  string id = 1;
  // When the run was produced.
  google.protobuf.Timestamp generated_at = 2;
  // What the run found. Empty when the configuration and the history
  // gave nothing to say, which is a real result: a system that always
  // has an opinion stops being read. Empty carries that meaning only
  // when `findings_evaluated` is true.
  repeated DiagnosisFinding findings = 3;
  // The previous run, when there is one. What changed between the two
  // is the part of a diagnosis that no single run can carry.
  string previous_diagnosis_id = 4;
  // Objectives read by the run.
  int32 objectives_analyzed = 5;
  // Campaigns read by the run.
  int32 campaigns_analyzed = 6;
  // The metrics as they stood at generation time. What moved between
  // two runs is the part of a diagnosis that no single run can state,
  // and this is what makes it recoverable later.
  OrgMetricsSnapshot metrics = 7;
  // Whether the patterns that produce findings were evaluated for this
  // diagnosis.
  //
  // A run freezes its metrics whether or not the interpretation half
  // completes, because measurement cannot be recovered afterwards and
  // interpretation can. When it did not complete, `findings` is empty
  // for a reason that says nothing about the organization: nothing
  // looked.
  //
  // An empty `findings` list is evidence that nothing was found only
  // when this is true; otherwise it is evidence of nothing at all, and
  // a consumer MUST NOT present it as a clean bill of health — no
  // warnings shown, "no issues detected", a zero on a findings count,
  // or a flat stretch in a findings-over-time series are all the same
  // false claim.
  //
  // False is the safe default: a producer that does not set it is taken
  // to have looked at nothing.
  bool findings_evaluated = 8;
}

// Request for a stored organization diagnosis.
message GetOrgDiagnosisRequest {
  // Retrieve a specific run. Empty returns the most recent one.
  // An id that does not exist returns NOT_FOUND.
  string diagnosis_id = 1;
}

// Response containing an organization diagnosis.
message GetOrgDiagnosisResponse {
  // The diagnosis. Absent when no run has ever been produced for the
  // organization — a run needs declared objectives to have anything to
  // read, and does not happen without them. Absence is presented as
  // absence, never as a diagnosis with no findings, which would say
  // something quite different.
  OrgDiagnosis diagnosis = 1;
}

// Request to list an organization's diagnoses with pagination.
message ListOrgDiagnosesRequest {
  // Pagination parameters.
  Pagination pagination = 1;
}

// Response containing a page of diagnoses.
message ListOrgDiagnosesResponse {
  // Diagnoses in this page, newest first. Each carries its own metrics
  // snapshot, so a page is enough to plot how the organization's
  // measurement system moved without walking the chain of previous
  // runs one fetch at a time.
  //
  // Entries whose `findings_evaluated` is false are not quiet months.
  // Leave them out of any count or series built on findings, and say
  // they were left out; kept in, the series reports when evaluation
  // succeeded rather than how the organization moved.
  repeated OrgDiagnosis diagnoses = 1;
  // Pagination metadata for fetching subsequent pages.
  PaginationMeta pagination_meta = 2;
}

// Request to run a diagnosis now.
// Empty — organization is extracted from the JWT.
message TriggerOrgDiagnosisRequest {}

// Response after triggering a diagnosis run.
message TriggerOrgDiagnosisResponse {
  // Remaining manual runs allowed this month.
  int32 remaining_this_month = 1;
  // Timestamp of the last diagnosis produced, null if never run.
  google.protobuf.Timestamp last_generated_at = 2;
}

// ─── Service ────────────────────────────────────────────────────────────────

// Provides cohort-level AI insights for campaign planning and optimization.
// All predictions are aggregate — no individual-level profiling.
// Data is derived from k-anonymized, differential-privacy-noised behavioral features.
// All RPCs operate within the caller's org (extracted from JWT).
service InsightsService {
  // Retrieve behavioral archetypes for a group based on anonymous feature vectors.
  // Returns empty archetypes if insufficient data (cold start).
  // Authorization: Requires PERMISSION_CAMPAIGNS_READ.
  rpc GetGroupArchetypes(GetGroupArchetypesRequest) returns (GetGroupArchetypesResponse);
  // Predict cohort-level ACK rate for a campaign targeting a specific group.
  // Returns a confidence interval that narrows as more campaign data accumulates.
  // Authorization: Requires PERMISSION_CAMPAIGNS_READ.
  rpc PredictCampaignACK(PredictCampaignACKRequest) returns (PredictCampaignACKResponse);
  // Get campaign configuration advisory (prediction + suggested escalation + archetypes).
  // Advisory is informational only — never drives automated decisions.
  // Authorization: Requires PERMISSION_CAMPAIGNS_READ.
  rpc GetCampaignAdvisory(GetCampaignAdvisoryRequest) returns (GetCampaignAdvisoryResponse);
  // Generate an AI-powered narrative summary of a group's insights.
  // Combines archetype, prediction, and campaign data into human-readable analysis.
  // Authorization: Requires PERMISSION_CAMPAIGNS_READ.
  rpc GetInsightNarrative(GetInsightNarrativeRequest) returns (GetInsightNarrativeResponse);
  // Manually trigger the ML training pipeline for the caller's organization.
  // Rate-limited by ml_manual_limit_monthly (default 3 per month, auto-resets).
  // Authorization: Requires PERMISSION_ORG_WRITE.
  rpc TriggerMLPipeline(TriggerMLPipelineRequest) returns (TriggerMLPipelineResponse);
  // Manually retrigger archetype clustering for a single group, reusing
  // the already-deployed SageMaker clustering model. Cheaper than a
  // full TriggerMLPipeline run because no training happens. Shares the
  // same ml_manual_limit_monthly quota as TriggerMLPipeline — callers
  // get N manual retrains per month across both RPCs.
  // Authorization: Requires PERMISSION_ORG_WRITE.
  rpc TriggerArchetypeClustering(TriggerArchetypeClusteringRequest) returns (TriggerArchetypeClusteringResponse);
  // Draft a campaign body for the given archetype using Bedrock with the
  // campaign-for-archetype prompt template. Used by the Compass
  // "Target this archetype" CTA to pre-fill the wizard's body field.
  // Cross-org group_id returns PERMISSION_DENIED, unknown archetype_label
  // returns NOT_FOUND.
  // Authorization: Requires PERMISSION_CAMPAIGNS_WRITE.
  rpc GenerateCampaignBodyDraft(GenerateCampaignBodyDraftRequest) returns (GenerateCampaignBodyDraftResponse);
  // Organization-wide communication profile: which kinds of messages the
  // organization sends, and how much messaging lands on one person.
  // Requires no configuration by the organization.
  // Authorization: Requires PERMISSION_CAMPAIGNS_READ.
  rpc GetOrgCommunicationProfile(GetOrgCommunicationProfileRequest) returns (GetOrgCommunicationProfileResponse);
  // Retrieve a stored diagnosis of the organization's measurement
  // system: the most recent run, or a specific earlier one. Findings
  // are advisory and always cite the records behind them; nothing here
  // scores the organization or blocks anything it does.
  // Authorization: Requires PERMISSION_ORG_READ.
  rpc GetOrgDiagnosis(GetOrgDiagnosisRequest) returns (GetOrgDiagnosisResponse);
  // List the organization's diagnoses, newest first, each with the
  // metrics snapshot taken when it ran.
  // Authorization: Requires PERMISSION_ORG_READ.
  rpc ListOrgDiagnoses(ListOrgDiagnosesRequest) returns (ListOrgDiagnosesResponse);
  // Run a diagnosis now instead of waiting for the next scheduled one.
  // Rate-limited per month with the remaining allowance returned on
  // every call; exhausting it returns RESOURCE_EXHAUSTED. Returns
  // FAILED_PRECONDITION for an organization with no declared
  // objectives, since a run would have nothing to read and an empty
  // diagnosis says something the data does not support.
  //
  // The permission is the organization one rather than the campaign
  // one: this reads the whole declared set and the whole history, which
  // is a different thing to be trusted with than operating one
  // campaign.
  // Authorization: Requires PERMISSION_ORG_WRITE.
  rpc TriggerOrgDiagnosis(TriggerOrgDiagnosisRequest) returns (TriggerOrgDiagnosisResponse);
}
