version: v2
# Every plugin is pinned. An unpinned remote plugin resolves to whatever is
# latest on the day someone runs `buf generate`, which makes codegen
# irreproducible: a contract change arrives carrying header rewrites across
# files it never touched, and those rewrites collide with every other open
# PR on the same generated files. Bump these deliberately, in their own
# change, so the diff says what it is.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: gen/rust
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: gen/rust
  - remote: buf.build/bufbuild/es:v2.13.0
    out: gen/ts
    opt: target=ts
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: docs
    opt: markdown,index.md
